name: Release

# Builds the macOS app (Apple silicon) as a disk image.
#
# - Run it by hand (Actions › Release › Run workflow, or
#   `gh workflow run release.yml`): the disk image is attached to the run as
#   the artifact "Editage-macos-arm64".
# - Push a tag such as `v0.1.0`: the disk image is also published as a GitHub
#   release for that tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-app:
    name: macOS app (arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build app and disk image
        run: packaging/macos/build-app.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Editage-macos-arm64
          path: |
            target/dist/*.dmg
            target/dist/*.dmg.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          target/dist/*.dmg target/dist/*.dmg.sha256
          --title "Editage $GITHUB_REF_NAME"
          --notes "Editage for Apple silicon Macs (macOS 13 or later). Signed ad hoc and not notarized; see README.md › Installing."
