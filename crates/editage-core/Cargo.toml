[package]
name = "editage-core"
description = "Portable document, encryption and save-transaction logic for the Editage encrypted text editor."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
age = { version = "0.11", default-features = false, features = ["armor"] }
secrecy = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = "0.10"
getrandom = "0.2"
thiserror = "2"
libc = "0.2"

[features]
# Lowers the scrypt work factor so tests run quickly. Test-only; a
# compile_error! rejects it in release builds.
test-support = []

[dev-dependencies]
tempfile = "3"
# Enables `test-support` for this crate's own integration tests.
editage-core = { path = ".", features = ["test-support"] }

[lints]
workspace = true
